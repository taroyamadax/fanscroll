<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 180px; padding: 12px; font-family: sans-serif; font-size: 14px; }
  label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; }
</style>
</head>
<body>
<label>
  <input type="checkbox" id="toggle" checked>
  FanScroll
</label>
<script>
  const cb = document.getElementById('toggle');
  chrome.storage.local.get('dragScrollEnabled', (r) => {
    cb.checked = r.dragScrollEnabled !== false;
  });
  cb.addEventListener('change', () => {
    chrome.storage.local.set({ dragScrollEnabled: cb.checked });
  });
</script>
</body>
</html>
